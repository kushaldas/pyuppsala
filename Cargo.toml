[package]
name = "pyuppsala"
version = "0.10.0"
edition = "2021"
rust-version = "1.77"
description = "Python bindings for the Uppsala XML library"
license = "BSD-2-Clause"
repository = "https://github.com/kushaldas/pyuppsala"
exclude = [
    "fuzz/**",
]

[lib]
name = "_pyuppsala"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
uppsala = "0.9.0"
pyuppsala-interop = { version = "=0.2.0", path = "crates/pyuppsala-interop" }
# HTTP client for the native fetch_many / fetch_and_parse_many APIs. Optional
# behind the default-on `net` feature so distro packagers can build a
# network-free extension with `--no-default-features`.
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "gzip"], optional = true }

[features]
default = ["net"]
net = ["dep:ureq"]

# The cdylib is the final artifact, so a max-optimization release profile pays off
# here: fat LTO lets uppsala's SIMD/lookup-table scanning hot loops inline across
# the crate boundary into pyuppsala's call sites, and a single codegen unit gives
# the optimizer the whole picture.
[profile.release]
lto = "fat"
codegen-units = 1
